<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secretary — Вход</title>
<style>
:root{--p:#5b7fff;--a:#00d4ff;--bg1:#a0d8ef;--bg2:#e0f7ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); position:relative; overflow:hidden}
body::before{content:''; position:absolute; inset:0; background: radial-gradient(ellipse 500px 420px at 20% 15%, rgba(255,255,255,0.9) 0%, transparent 70%), radial-gradient(ellipse 600px 500px at 85% 85%, rgba(91,127,255,0.16) 0%, transparent 68%)}
.bubbles{position:absolute; inset:0; pointer-events:none}
.bubbles span{position:absolute; border-radius:50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.5) 28%, rgba(150,210,255,0.22) 62%, rgba(91,127,255,0.12) 100%); border:1px solid rgba(255,255,255,0.7); box-shadow: inset 0 8px 16px rgba(255,255,255,0.85), 0 8px 24px rgba(91,127,255,0.10)}
.b1{width:160px;height:160px; left:-20px; top:40px; opacity:.5}
.b2{width:100px;height:100px; right:20px; top:120px; opacity:.4}
.b3{width:220px;height:220px; right:-40px; bottom:-30px; opacity:.25}
.login-box{position:relative; background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(240,249,255,0.92) 100%); backdrop-filter: blur(16px); border:1px solid rgba(255,255,255,0.85); border-radius:24px; padding:32px 24px; width:90%; max-width:360px; text-align:center; box-shadow: 0 12px 36px rgba(31,38,135,0.18), inset 0 1px 0 rgba(255,255,255,1)}
.logo{width:56px;height:56px; border-radius:16px; margin:0 auto 14px; background: linear-gradient(135deg, var(--p) 0%, var(--a) 100%); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; box-shadow:0 6px 16px rgba(91,127,255,0.4), inset 0 1px 0 rgba(255,255,255,0.6); position:relative; overflow:hidden}
.logo::after{content:''; position:absolute; top:4px; left:6px; right:12px; height:18px; background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, transparent 100%); border-radius:12px; }
h2{font-size:20px; font-weight:800; letter-spacing:-0.4px; color:#1a2a4a}
.sub{font-size:12px; color:#6a8aaa; font-weight:600; margin-top:4px; margin-bottom:18px}
input{width:100%; padding:14px 14px; border:1px solid rgba(130,160,200,0.2); border-radius:12px; background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.78) 100%); color:#1a2a4a; font-size:15px; outline:none; margin-bottom:14px; box-shadow:inset 0 1px 0 #fff, 0 1px 6px rgba(0,0,0,0.04)}
input:focus{border-color:var(--p); box-shadow:0 0 0 3px rgba(91,127,255,0.15)}
button{width:100%; padding:14px; border:none; border-radius:12px; background: linear-gradient(135deg, var(--p) 0%, var(--a) 100%); color:#fff; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 6px 16px rgba(91,127,255,0.32), inset 0 1px 0 rgba(255,255,255,0.6)}
button:active{transform:scale(.98)}
.error{color:#ff4757; font-size:13px; font-weight:700; margin-bottom:12px; background:rgba(255,71,87,0.08); padding:8px; border-radius:10px; border:1px solid rgba(255,71,87,0.15)}
.foot{font-size:11px; color:#6a8aaa; margin-top:14px; font-weight:600}
</style>
</head>
<body>
<div class="bubbles"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
<div class="login-box">
  <div class="logo">☁️</div>
  <h2>Secretary</h2>
  <div class="sub">Frutiger Aero • Личный кабинет</div>
  {% if error %}<p class="error">Неверный пароль</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Пароль" autofocus required>
    <button type="submit">Войти ✨</button>
  </form>
  <div class="foot">Введи пароль из WEB_PASSWORD</div>
</div>
</body>
</html>
