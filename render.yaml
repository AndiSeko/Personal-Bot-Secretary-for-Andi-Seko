# Render — деплой через Blueprint (Infrastructure as Code)
# Подключи репозиторий на https://dashboard.render.com → New → Blueprint
# Render сам создаст сервис + Postgres
services:
  - type: web
    name: secretary-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_USERNAME
        value: andi_seko
      - key: OWNER_ID
        sync: false
      - key: WEB_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
    autoDeploy: true

# Render Free Postgres (secretary-db) — УДАЛЁН: expire через ~30 дней, suspend + удаление через 14 дней.
# Не привязываем сервис к fromDatabase — DATABASE_URL задаётся вручную из Neon (free, вечный).
# См. HOSTING.md раздел 2 Вариант A. Старую secretary-db можно удалить после переезда.
