# Render — деплой через Blueprint (Infrastructure as Code)
# Подключи репозиторий на https://dashboard.render.com → New → Blueprint
# Render сам создаст сервис + Postgres
services:
  - type: web
    name: secretary-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_USERNAME
        value: andi_seko
      - key: OWNER_ID
        sync: false
      - key: WEB_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: secretary-db
          property: connectionString
      - key: PORT
        value: 10000
    autoDeploy: false

databases:
  - name: secretary-db
    plan: free
    # Render free Postgres удаляется через 30 дней и требует пересоздания.
    # Для вечного фри — замени на Neon (https://neon.tech) и задай DATABASE_URL вручную,
    # либо поставь план starter ($7). См. HOSTING.md
